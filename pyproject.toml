[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
ferrari-preowned = "ferrari_preowned_client.cli:main"

[project]
name = "ferrari-preowned-client"
version = "1.4.0"
description = "Stealthy, verified Python client for preowned.ferrari.com — search API, detail pages, THRON galleries, and VIN decryption with a self-healing keystream oracle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Modena Maestro" }]
keywords = ["ferrari", "preowned", "api-client", "vin", "scraper"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["ferrari_preowned_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
